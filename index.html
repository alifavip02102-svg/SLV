<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PO Academy — Mini App</title>
  <meta name="theme-color" content="#070b14">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">PO</div>
        <div>
          <h1>PO ACADEMY</h1>
          <p>закрытый терминал обучения</p>
        </div>
      </div>
      <div class="clocks">
        <div class="clock"><small>Москва</small><b id="clkMsk">--:--:--</b></div>
        <div class="clock"><small>Киев</small><b id="clkKiev">--:--:--</b></div>
        <div class="online"><small>в сети</small><b><span class="dot"></span><span id="onlineCount">1</span></b></div>
      </div>
    </header>

    <section class="gate" id="gate">
      <div id="gateBox"></div>
    </section>

    <main id="appMain" class="hidden">
      <section class="screen" id="screen-home"></section>
      <section class="screen" id="screen-neuro"></section>
      <section class="screen" id="screen-learn"></section>
      <section class="screen" id="screen-patterns"></section>
      <section class="screen" id="screen-strategies"></section>
      <section class="screen" id="screen-calc"></section>
      <section class="screen" id="screen-calendar"></section>
      <section class="screen" id="screen-news"></section>
      <section class="screen" id="screen-chat"></section>
      <section class="screen" id="screen-profile"></section>
    </main>

    <nav class="nav hidden" id="nav">
      <button data-go="screen-home" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7v9H4z"/></svg>
        Главная
      </button>
      <button data-go="screen-neuro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M17 7.4L18.4 6M5.6 18.4L7 17"/></svg>
        ИИ
      </button>
      <button data-go="screen-learn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4zM8 5v14"/></svg>
        База
      </button>
      <button data-go="screen-patterns">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19V9M10 19V5M15 19v-7M20 19V8"/></svg>
        Паттерны
      </button>
      <button data-go="screen-profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M5 20c1.5-4 12.5-4 14 0"/></svg>
        Ещё
      </button>
    </nav>
  </div>

  <script>
    // Быстрые переходы из профиля «Ещё»
    document.addEventListener("click", (e) => {
      if (e.target && e.target.id === "moreMenu") return;
    });
  </script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Доп. пункты в профиле через панель «Ещё»: стратегии / калькулятор / календарь / новости / чат
    const extra = document.createElement("div");
    extra.id = "moreBar";
    extra.style.cssText = "display:none;position:fixed;left:8px;right:8px;bottom:64px;z-index:40;background:#101826;border:1px solid #1e2c44;border-radius:16px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.4)";
    extra.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <button class="btn" data-go="screen-strategies">Стратегии M1</button>
        <button class="btn" data-go="screen-calc">Калькулятор</button>
        <button class="btn" data-go="screen-calendar">Календарь</button>
        <button class="btn" data-go="screen-news">Новости</button>
        <button class="btn" data-go="screen-chat">Чат</button>
        <button class="btn" data-go="screen-profile">Профиль / админ</button>
      </div>`;
    document.body.appendChild(extra);
    const moreBtn = document.querySelector('.nav button[data-go="screen-profile"]');
    moreBtn.addEventListener("click", () => {
      extra.style.display = extra.style.display === "none" ? "block" : "none";
    });
    extra.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
      extra.style.display = "none";
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      const el = document.getElementById(b.dataset.go);
      if (el) el.classList.add("active");
    }));
  </script>
</body>
</html>
